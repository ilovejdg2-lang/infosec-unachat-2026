name: Desplegar chat en Render

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: TEST
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Ejecutar pruebas de integración
        run: npm run test:integration

      - name: Instalar el navegador de las pruebas de extremo a extremo
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas de extremo a extremo
        run: npm run test:e2e

  deploy:
    name: DEPLOY
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Identificar el commit validado
        run: echo "Commit ${GITHUB_SHA}"

      - name: Verificar el secreto de despliegue
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "El secreto RENDER_DEPLOY_HOOK_URL no está configurado."
            exit 1
          fi

      - name: Solicitar el despliegue a Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set +e
          body_file="$(mktemp)"
          case "$RENDER_DEPLOY_HOOK_URL" in
            *\?*) ref_param="&ref=${GITHUB_SHA}" ;;
            *) ref_param="?ref=${GITHUB_SHA}" ;;
          esac
          http_code="$(curl --silent --output "$body_file" --write-out "%{http_code}" \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}${ref_param}")"
          curl_status=$?
          set -e

          echo "Commit enviado: ${GITHUB_SHA}"
          echo "Respuesta HTTP: ${http_code}"

          if [ "$curl_status" -ne 0 ] || [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Render rechazó la solicitud de despliegue."
            if [ -s "$body_file" ]; then
              sed -E 's#(https://api\.render\.com/deploy/[^[:space:]?]*)\?[^[:space:]]*#\1?key=***#g' "$body_file"
            fi
            rm -f "$body_file"
            exit 1
          fi

          rm -f "$body_file"
